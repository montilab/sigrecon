url: https://montilab.github.io/sigrecon/
template:
  bootstrap: 5

reference:
- title: Recontextualization methods
  desc: >
    Methods that take a source-context signature and reconstruct
    it in a target context.
  contents:
  - recontextualize
  - projectCor
  - network_sig
  - wgcna.adj

- title: Benchmarking
  desc: >
    Evaluating a recontextualized signature against source/true signatures.
  contents:
  - sig_eval_table
  - paired_eval_table
  - jaccard
  - v.jaccard
  - v.fgsea
  - fishers_meta_p
  - count_displaced_genes

- title: Datasets
  desc: >
    Bundled demo data and on-demand access to the full-size datasets.
  contents:
  - demo_datasets
  - get_dataset
  - list_datasets

- title: Utilities
  contents:
  - make_bpparam
  - sig_filter_fn
